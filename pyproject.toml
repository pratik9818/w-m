[project]
name = "website-maker"
version = "0.1.0"
description = "Telegram bot that builds and hosts websites for small businesses"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.15",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "python-slugify>=8.0",
    "httpx>=0.27",
    "google-genai>=1.0",
]

[project.optional-dependencies]
worker = [
    "arq>=0.26",
    "anthropic>=0.40",
    "playwright>=1.48",
    "daytona>=0.200",
    "blake3>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot_api*", "db*", "worker*"]
